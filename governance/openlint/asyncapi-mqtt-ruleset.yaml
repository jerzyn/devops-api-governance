# MQTT API guidelines as code: the async rules plus the MQTT ones.
# Lint an MQTT contract with this ruleset; the PR workflow picks it from the
# contract's server protocol (mqtt, secure-mqtt).
extends:
  - ./asyncapi-ruleset.yaml
rules:
  # ------------------------------------------------------------------------- #
  # MQTT API guidelines                                                        #
  # ------------------------------------------------------------------------- #

  api-peak:mqtt1:2026-topic-naming:
    description: Topics MUST be lowercase levels separated by '/', with {camelCase} parameters and no wildcards.
    message: "Topic '{{value}}' MUST be lowercase levels (a-z, 0-9, -) or {camelCase} parameters separated by '/', without leading or trailing '/', wildcards or '$'. \n http://localhost:7007/docs/default/component/api-guidelines/mqtt/#topic-naming-api-peakmqtt12026-topic-naming"
    severity: error
    given: $.channels[?(@.address)].address
    then:
      function: pattern
      functionOptions:
        match: '^(?:[a-z0-9-]+|\{[a-z][a-zA-Z0-9]*\})(?:/(?:[a-z0-9-]+|\{[a-z][a-zA-Z0-9]*\}))*$'

  api-peak:mqtt2:2026-topic-version:
    description: Every topic MUST contain a major version level v{MAJOR}.
    message: "Topic '{{value}}' MUST contain a version level such as 'v1'. \n http://localhost:7007/docs/default/component/api-guidelines/mqtt/#topic-versioning-api-peakmqtt22026-topic-version"
    severity: error
    given: $.channels[?(@.address)].address
    then:
      function: pattern
      functionOptions:
        match: '(^|/)v[0-9]+(/|$)'

  api-peak:mqtt6:2026-one-event-type-per-topic:
    description: Every channel MUST carry exactly one message type.
    message: "Channel MUST carry exactly one message type; give each event type its own topic. \n http://localhost:7007/docs/default/component/api-guidelines/mqtt/#one-event-type-per-topic-api-peakmqtt62026-one-event-type-per-topic"
    severity: error
    given: $.channels[*]
    then:
      field: messages
      function: length
      functionOptions:
        min: 1
        max: 1

  api-peak:mqtt3:2026-qos:
    description: Every operation MUST declare bindings.mqtt.qos.
    message: "Operation MUST declare its MQTT quality of service in bindings.mqtt.qos. \n http://localhost:7007/docs/default/component/api-guidelines/mqtt/#quality-of-service-api-peakmqtt32026-qos"
    severity: error
    given: $.operations[*]
    then:
      field: bindings.mqtt.qos
      function: defined

  api-peak:mqtt4:2026-retain:
    description: Every operation SHOULD declare bindings.mqtt.retain.
    message: "Operation SHOULD declare bindings.mqtt.retain. \n http://localhost:7007/docs/default/component/api-guidelines/mqtt/#retained-messages-api-peakmqtt42026-retain"
    severity: warn
    given: $.operations[*]
    then:
      field: bindings.mqtt.retain
      function: defined

  api-peak:mqtt5:2026-secure-transport:
    description: Servers MUST use secure-mqtt; plain mqtt only for a local broker.
    message: "Server host '{{value}}' uses plain mqtt: use secure-mqtt (TLS); plain mqtt is only for localhost, 127.0.0.1 or mosquitto. \n http://localhost:7007/docs/default/component/api-guidelines/mqtt/#secure-transport-api-peakmqtt52026-secure-transport"
    severity: error
    given: $.servers[?(@.protocol === 'mqtt')].host
    then:
      function: pattern
      functionOptions:
        match: '^(localhost|127\.0\.0\.1|mosquitto)(:[0-9]+)?$'

# Backstage catalog entities for this repository. Discovered by the Gitea
# entity provider (scans the Gitea org for catalog-info.yaml at repo root).
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: order-events-api
  title: Order Events API
  description: Order lifecycle events over MQTT, described with AsyncAPI 3.1.0.
  tags:
    - asyncapi
    - mqtt
    - orders
  links:
    - url: http://localhost:8080/#/services
      title: 'Microcks: mock events and contract tests'
      icon: dashboard
spec:
  type: asyncapi
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  definition:
    $text: ./contracts/order-events-asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-backend
  description: Publishes the Order Events API's events (the provider under test).
  tags:
    - mqtt
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  providesApis:
    - order-events-api
  dependsOn:
    - resource:default/mqtt-broker
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-subscriber
  description: Consumes the Order Events API and logs every event.
  tags:
    - mqtt
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  consumesApis:
    - order-events-api
  dependsOn:
    - resource:default/mqtt-broker
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: mqtt-broker
  title: MQTT broker
  description: Eclipse Mosquitto, the broker the order events travel through (mqtt://mosquitto:1883).
  tags:
    - mqtt
    - mosquitto
spec:
  type: message-broker
  owner: group:default/platform-team
  system: orders
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: orders
  description: Order processing, connected through order lifecycle events.
spec:
  owner: group:default/platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Owns API governance tooling and the demo platform.
spec:
  type: team
  children: []

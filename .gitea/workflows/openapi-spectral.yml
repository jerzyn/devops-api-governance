name: OpenAPI Spectral validation

on:
  pull_request:
    branches:
      - main

jobs:
  spectral-openapi-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Show Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install Spectral CLI
        run: |
          npm install -g @stoplight/spectral-cli

      - name: Find OpenAPI files
        id: find_openapi
        shell: bash
        run: |
          set -e
          FILES=$(git ls-files '*openapi*.yml' '*openapi*.yaml' 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "No OpenAPI files found in this PR; skipping Spectral."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found OpenAPI files:"
            echo "$FILES"
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Spectral on OpenAPI files
        if: steps.find_openapi.outputs.has_files == 'true'
        shell: bash
        run: |
          set -e
          echo "${{ steps.find_openapi.outputs.files }}" | while IFS= read -r f; do
            [ -n "$f" ] && spectral lint -r spectral-ruleset.yaml "$f" || true
          done

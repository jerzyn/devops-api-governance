name: PR API governance

# Single PR gate, four stages run in order (each gated by `needs:`):
#   1. spectral-openapi-check — design-time lint of PR-changed OpenAPI files.
#      The governance ruleset is NOT vendored here; it is linked: the job clones
#      the central governance repo at run time and lints against its ruleset.
#   2. breaking-changes-check — diff every PR-modified OpenAPI file against its
#      version on the PR's base branch using oasdiff; fail on any breaking
#      change. New (added) files are skipped (no baseline). Skipped entirely
#      on workflow_dispatch (no PR base ref).
#   3. contract-test — runtime contract test of the running backend
#      against the PR's contract. Runs ONLY if the two gates above pass
#      (don't contract-test a contract that fails lint or breaks consumers).
#   4. gateway-deploy-check — generates a KrakenD config from the PR's
#      contract, deploys it to the running KrakenD instance, and re-runs the
#      same contract test through the gateway.
#
# Requires the "contract" and "gateway" compose profiles up on gitea-network:
#   docker compose --profile contract --profile gateway up -d
#
# To demonstrate a failing contract gate, restart the backend with drift:
#   BACKEND_DRIFT=true docker compose --profile contract up -d backend

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # This repo on Gitea, as job containers on gitea-network reach it.
  REPO_URL: http://gitea:3000/${{ github.repository }}.git
  # What to check out: the PR head, or the dispatched ref on workflow_dispatch.
  CHECKOUT_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
  # Central governance repo (ruleset + custom Spectral functions). Linked, not
  # vendored: the lint job clones it at run time. Anonymous clone (public repo).
  GOVERNANCE_REPO: http://gitea:3000/governance-demo/api-governance.git
  # Server-to-server API base (CI job container -> Microcks on gitea-network).
  MICROCKS_URL: http://microcks-uber:8080
  # Human-facing base for report links printed to the CI log. The internal
  # hostname is unreachable from a browser; the host publishes 8080.
  MICROCKS_PUBLIC_URL: http://localhost:8080
  TEST_ENDPOINT: http://backend:8081
  # Service name part of the Microcks serviceId; the version part is derived
  # from the contract at runtime (see "Run contract test") so bumping
  # info.version does not break the hardcoded reference.
  API_TITLE: "Orders API"
  CONTRACT_FILE: contracts/orders-openapi.yaml
  # Server-to-server: job container -> krakend on gitea-network.
  GATEWAY_URL: http://krakend:8090
  # Server-to-server: job container -> krakend-deployer on gitea-network.
  GATEWAY_DEPLOYER_URL: http://krakend-deployer:9000

jobs:
  spectral-openapi-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        shell: bash
        run: |
          # Plain git against Gitea instead of actions/checkout, which is
          # downloaded from github.com on every job. Full history, so the base
          # branch is there to diff against.
          set -e
          git init -q .
          git remote add origin "${REPO_URL}"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q origin "${CHECKOUT_REF}"
          git checkout -q FETCH_HEAD

      # The CI image (ci-image/Dockerfile) has every tool preinstalled; the
      # install steps only download when a tool is missing.
      - name: Install Spectral CLI
        shell: bash
        run: command -v spectral >/dev/null || npm install -g @stoplight/spectral-cli@6.16.3

      - name: Fetch governance ruleset (linked, not vendored)
        shell: bash
        run: |
          set -e
          # The "link" to central governance: clone the ruleset + its custom
          # Spectral functions. functionsDir in the ruleset is relative, so the
          # functions resolve from the clone.
          rm -rf .governance
          git clone --depth 1 "${GOVERNANCE_REPO}" .governance
          echo "Linked governance ruleset:"; ls .governance/spectral-ruleset.yaml

      - name: Find changed OpenAPI files
        id: find_openapi
        shell: bash
        run: |
          set -e
          git fetch -q origin "${{ github.base_ref }}" || true
          BASE="origin/${{ github.base_ref }}"
          # Only lint OpenAPI files changed in this PR (added/modified), not the
          # whole tree — so the intentionally-invalid example doesn't break
          # unrelated PRs.
          FILES=$(git diff --name-only --diff-filter=AM "${BASE}...HEAD" -- \
            '*openapi*.yml' '*openapi*.yaml' 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "No changed OpenAPI files in this PR; skipping Spectral."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed OpenAPI files:"; echo "$FILES"
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            { echo "files<<EOF"; echo "$FILES"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Run Spectral (fail on errors)
        if: steps.find_openapi.outputs.has_files == 'true'
        shell: bash
        run: |
          # No `|| true`: spectral exits non-zero on error-severity findings, so
          # the job (gate) fails. A here-doc loop keeps the fail flag out of a
          # pipe subshell.
          FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::spectral $f"
            spectral lint -r .governance/spectral-ruleset.yaml "$f" || FAIL=1
            echo "::endgroup::"
          done <<'EOF'
          ${{ steps.find_openapi.outputs.files }}
          EOF
          exit $FAIL

  breaking-changes-check:
    needs: spectral-openapi-check
    runs-on: ubuntu-latest
    # workflow_dispatch has no PR base ref to diff against. The two real PR
    # gates (spectral + contract-test) still run; this BC gate is PR-only.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR branch
        shell: bash
        run: |
          # Plain git against Gitea instead of actions/checkout, which is
          # downloaded from github.com on every job. Full history, so the base
          # branch is there to diff against.
          set -e
          git init -q .
          git remote add origin "${REPO_URL}"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q origin "${CHECKOUT_REF}"
          git checkout -q FETCH_HEAD

      - name: Install oasdiff (pinned)
        shell: bash
        env:
          OASDIFF_VERSION: 1.19.0
        run: |
          set -e
          if ! command -v oasdiff >/dev/null; then
            curl -fsSL -o /tmp/oasdiff.tgz \
              "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
            tar -xzf /tmp/oasdiff.tgz -C /tmp
            install -m 0755 /tmp/oasdiff /usr/local/bin/oasdiff
          fi
          oasdiff --version

      - name: Find modified OpenAPI files vs base
        id: find_openapi
        shell: bash
        run: |
          set -e
          git fetch -q origin "${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
          # diff-filter=M => only files that exist on BOTH sides. We skip 'A'
          # (added) because a brand-new file has no base to diff against, and
          # 'D' (deleted) because there is no PR head file to lint.
          FILES=$(git diff --name-only --diff-filter=M "${BASE}...HEAD" -- \
            '*openapi*.yml' '*openapi*.yaml' 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "No modified OpenAPI files vs ${BASE}; skipping BC check."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "OpenAPI files to BC-check:"; echo "$FILES"
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            { echo "files<<EOF"; echo "$FILES"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Run oasdiff breaking (fail on breaking changes)
        if: steps.find_openapi.outputs.has_files == 'true'
        shell: bash
        run: |
          BASE="origin/${{ github.base_ref }}"
          FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Short-circuit: if the file content vs base is identical, skip
            # entirely (covers the "omit when files are identical" intent even
            # if some other tool listed the file as touched).
            if git diff --quiet "${BASE}...HEAD" -- "$f"; then
              echo "::notice file=${f}::No diff vs ${BASE}; skipping."
              continue
            fi
            echo "::group::oasdiff breaking ${f} (vs ${BASE})"
            # Human-readable summary in the log (don't fail here — the second
            # call below owns the exit code).
            oasdiff breaking "${BASE}:${f}" "${f}" -f text || true
            # Inline annotations + the actual gate exit code. --fail-on ERR
            # makes oasdiff exit 1 when any ERR-severity breaking finding is
            # reported (default in 1.19.0 is to print but exit 0).
            oasdiff breaking --fail-on ERR "${BASE}:${f}" "${f}" -f githubactions || FAIL=1
            echo "::endgroup::"
          done <<'EOF'
          ${{ steps.find_openapi.outputs.files }}
          EOF
          exit $FAIL

  contract-test:
    needs: breaking-changes-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        shell: bash
        run: |
          # Plain git against Gitea instead of actions/checkout, which is
          # downloaded from github.com on every job. Full history, so the base
          # branch is there to diff against.
          set -e
          git init -q .
          git remote add origin "${REPO_URL}"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q origin "${CHECKOUT_REF}"
          git checkout -q FETCH_HEAD

      - name: Wait for Microcks to be ready
        shell: bash
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -sf "${MICROCKS_URL}/api/health" >/dev/null; then
              echo "Microcks is up."; exit 0
            fi
            echo "waiting for Microcks ($i)..."; sleep 2
          done
          echo "Microcks did not become ready in time." >&2
          exit 1

      - name: Import contract into Microcks
        shell: bash
        run: |
          set -e
          # Keycloak is disabled in the uber stack, so the upload endpoint needs
          # no auth. mainArtifact=true marks this as the primary artifact.
          # Re-importing the same contract is idempotent.
          curl -sf -X POST \
            -F "file=@${CONTRACT_FILE}" \
            "${MICROCKS_URL}/api/artifact/upload?mainArtifact=true"
          echo "Imported ${CONTRACT_FILE}."

      - name: Run contract test
        shell: bash
        run: |
          set -e
          # Derive the service version from the contract's info.version so a
          # version bump in the PR is tested against the matching Microcks
          # service (not a stale hardcoded version).
          VERSION=$(grep -E '^[[:space:]]+version:' "${CONTRACT_FILE}" | head -1 \
            | sed -E 's/.*version:[[:space:]]*//' | tr -d '"'"'"' ')
          API_SERVICE="${API_TITLE}:${VERSION}"
          echo "Testing service: ${API_SERVICE}"
          # Launch the test via the Microcks REST API (no microcks-cli binary —
          # the published linux-amd64 release asset 404s). Pure curl + poll.
          BODY="{\"serviceId\":\"${API_SERVICE}\",\"testEndpoint\":\"${TEST_ENDPOINT}\",\"runnerType\":\"OPEN_API_SCHEMA\",\"timeout\":10000}"
          RESP=$(curl -sf -X POST "${MICROCKS_URL}/api/tests" \
            -H 'Content-Type: application/json' -d "${BODY}")
          TID=$(printf '%s' "$RESP" | grep -o '"id":"[a-f0-9]*"' | head -1 | sed 's/.*:"\(.*\)"/\1/')
          if [ -z "$TID" ]; then
            echo "Failed to launch test. Response: $RESP" >&2; exit 1
          fi
          echo "Launched test ${TID}; polling..."

          RESULT=""
          for i in $(seq 1 20); do
            sleep 2
            RESULT=$(curl -sf "${MICROCKS_URL}/api/tests/${TID}")
            printf '%s' "$RESULT" | grep -q '"inProgress":false' && break
            echo "  in progress ($i)..."
          done

          # Top-level success is the one immediately followed by ,"inProgress".
          SUCCESS=$(printf '%s' "$RESULT" | grep -o '"success":[a-z]*,"inProgress"' \
            | head -1 | sed 's/"success":\([a-z]*\).*/\1/')
          echo "Test ${TID} success=${SUCCESS}"
          # Human-facing link: localhost (browser-reachable), not the internal
          # microcks-uber hostname used for the API calls above.
          echo "Details: ${MICROCKS_PUBLIC_URL}/#/tests/${TID}"
          if [ "$SUCCESS" != "true" ]; then
            echo "Contract test FAILED:" >&2
            printf '%s\n' "$RESULT" >&2
            exit 1
          fi
          echo "Contract test PASSED."

  gateway-deploy-check:
    needs: contract-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        shell: bash
        run: |
          # Plain git against Gitea instead of actions/checkout, which is
          # downloaded from github.com on every job. Full history, so the base
          # branch is there to diff against.
          set -e
          git init -q .
          git remote add origin "${REPO_URL}"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q origin "${CHECKOUT_REF}"
          git checkout -q FETCH_HEAD

      - name: Fetch governance gateway tooling (linked, not vendored)
        shell: bash
        run: |
          set -e
          rm -rf .governance-gateway
          git clone --depth 1 "${GOVERNANCE_REPO}" .governance-gateway
          echo "Linked gateway tooling:"; ls .governance-gateway/gateway/generate.js

      - name: Install generator dependencies
        shell: bash
        run: node -e "require('js-yaml')" 2>/dev/null || npm install --prefix .governance-gateway/gateway

      - name: Generate krakend.json from the PR contract
        shell: bash
        run: |
          set -e
          node .governance-gateway/gateway/generate.js "${CONTRACT_FILE}" krakend.json
          echo "Generated krakend.json:"; cat krakend.json

      # Deliberately NOT pinned to the same version as the krakend image in
      # docker-compose.yml (2.13.11). Tried that: krakend-ce's 2.13.11 CLI
      # binary requires GLIBC_2.32+/2.34+, which this job's container
      # (node:20-bullseye, glibc 2.31) doesn't have - "version `GLIBC_2.34'
      # not found" at run time. `krakend check` only validates the v3 config
      # schema (version/timeout/cache_ttl/output_encoding/endpoints), which
      # has been stable across releases, so the validator's version doesn't
      # need to track the running gateway's version - 2.6.2 runs fine on
      # this container and was already verified live earlier.
      - name: Install KrakenD CLI (pinned)
        shell: bash
        env:
          KRAKEND_VERSION: 2.6.2
        run: |
          set -e
          if ! command -v krakend >/dev/null; then
            # Asset name is krakend_<version>_amd64_generic-linux.tar.gz, NOT
            # krakend_<version>_linux_amd64.tar.gz - verified against the
            # krakend-ce GitHub releases API for this version.
            curl -fsSL -o /tmp/krakend.tgz \
              "https://github.com/krakend/krakend-ce/releases/download/v${KRAKEND_VERSION}/krakend_${KRAKEND_VERSION}_amd64_generic-linux.tar.gz"
            tar -xzf /tmp/krakend.tgz -C /tmp
            install -m 0755 /tmp/usr/bin/krakend /usr/local/bin/krakend
          fi
          krakend version

      # `krakend check -c` is the validation this version provides; no
      # stricter lint flag is in use.
      - name: Validate the generated config (fail on any error)
        shell: bash
        run: krakend check -c krakend.json

      - name: Deploy to the running gateway
        shell: bash
        run: |
          set -e
          curl -sf -X POST "${GATEWAY_DEPLOYER_URL}/deploy" \
            -H 'Content-Type: application/json' \
            --data-binary @krakend.json
          echo "Deployed."

      - name: Wait for KrakenD to be ready
        shell: bash
        run: |
          set -e
          for i in $(seq 1 30); do
            # curl's own -w format already writes "000" on a failed/refused
            # connection (verified: it always evaluates -w, even on
            # failure) - appending "|| echo 000" here would double it to
            # "000000", which then never matches the != "000" check below
            # and falsely reports "ready" on the very first try. Do not add
            # that back.
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${GATEWAY_URL}/orders/readiness-probe")
            if [ "$CODE" != "000" ]; then
              echo "KrakenD is up (HTTP $CODE)."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "KrakenD did not become ready in time." >&2
              exit 1
            fi
            echo "waiting for KrakenD ($i)..."; sleep 2
          done

      - name: Run contract test through the gateway
        shell: bash
        run: |
          set -e
          # Same contract already imported into Microcks by contract-test -
          # just launch another test run against the gateway's endpoint.
          VERSION=$(grep -E '^[[:space:]]+version:' "${CONTRACT_FILE}" | head -1 \
            | sed -E 's/.*version:[[:space:]]*//' | tr -d '"'"'"' ')
          API_SERVICE="${API_TITLE}:${VERSION}"
          echo "Testing service through gateway: ${API_SERVICE}"
          BODY="{\"serviceId\":\"${API_SERVICE}\",\"testEndpoint\":\"${GATEWAY_URL}\",\"runnerType\":\"OPEN_API_SCHEMA\",\"timeout\":10000}"
          RESP=$(curl -sf -X POST "${MICROCKS_URL}/api/tests" \
            -H 'Content-Type: application/json' -d "${BODY}")
          TID=$(printf '%s' "$RESP" | grep -o '"id":"[a-f0-9]*"' | head -1 | sed 's/.*:"\(.*\)"/\1/')
          if [ -z "$TID" ]; then
            echo "Failed to launch test. Response: $RESP" >&2; exit 1
          fi
          echo "Launched test ${TID}; polling..."

          RESULT=""
          for i in $(seq 1 20); do
            sleep 2
            RESULT=$(curl -sf "${MICROCKS_URL}/api/tests/${TID}")
            printf '%s' "$RESULT" | grep -q '"inProgress":false' && break
            echo "  in progress ($i)..."
          done

          SUCCESS=$(printf '%s' "$RESULT" | grep -o '"success":[a-z]*,"inProgress"' \
            | head -1 | sed 's/"success":\([a-z]*\).*/\1/')
          echo "Test ${TID} success=${SUCCESS}"
          echo "Details: ${MICROCKS_PUBLIC_URL}/#/tests/${TID}"
          if [ "$SUCCESS" != "true" ]; then
            echo "Gateway contract test FAILED:" >&2
            printf '%s\n' "$RESULT" >&2
            exit 1
          fi
          echo "Gateway contract test PASSED."

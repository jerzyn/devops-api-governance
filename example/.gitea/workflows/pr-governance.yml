name: PR API governance

# Gates run in order, each one gated by `needs:` as in the REST demo:
#   1. asyncapi-lint   validate the changed AsyncAPI contracts and lint them
#                      against the central guidelines (Stage 3)
# Later stages add the contract test, the broker policy and the breaking
# change check.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # This repo on Gitea, as job containers on async-gitea-network reach it.
  REPO_URL: http://gitea:3000/${{ github.repository }}.git
  # What to check out: the PR head, or the dispatched ref on workflow_dispatch.
  CHECKOUT_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
  # The central governance repo: ruleset, custom functions and guidelines.
  GOVERNANCE_REPO: http://gitea:3000/async-governance-demo/async-api-governance.git

jobs:
  asyncapi-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        shell: bash
        run: |
          # Plain git against Gitea instead of actions/checkout, which is
          # downloaded from github.com on every job.
          set -e
          git init -q .
          git remote add origin "${REPO_URL}"
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch -q origin "${CHECKOUT_REF}"
          git checkout -q FETCH_HEAD

      - name: Find changed AsyncAPI files
        id: find
        shell: bash
        run: |
          set -e
          if [ -n "${{ github.base_ref }}" ]; then
            # Only the contracts this PR adds or changes.
            FILES=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- \
              '*asyncapi*.yml' '*asyncapi*.yaml' 2>/dev/null || true)
          else
            # workflow_dispatch: no base, check every contract.
            FILES=$(git ls-files '*asyncapi*.yml' '*asyncapi*.yaml')
          fi
          if [ -z "$FILES" ]; then
            echo "No changed AsyncAPI files; nothing to check."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "AsyncAPI files:"; echo "$FILES"
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            { echo "files<<EOF"; echo "$FILES"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      # The CI image (ci-image/Dockerfile) has every tool preinstalled; the
      # install steps only download when a tool is missing.
      - name: Validate (fail on errors)
        if: steps.find.outputs.has_files == 'true'
        shell: bash
        run: |
          command -v asyncapi >/dev/null || npm install -g @asyncapi/cli@6.3.0
          FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::asyncapi validate $f"
            asyncapi validate "$f" || FAIL=1
            echo "::endgroup::"
          done <<'EOF'
          ${{ steps.find.outputs.files }}
          EOF
          exit $FAIL

      - name: Fetch governance ruleset (linked, not vendored)
        if: steps.find.outputs.has_files == 'true'
        shell: bash
        run: |
          set -e
          # The "link" to central governance: clone the ruleset and its custom
          # functions. functionsDir in the ruleset is relative, so the
          # functions resolve from the clone.
          rm -rf .governance
          git clone -q --depth 1 "${GOVERNANCE_REPO}" .governance
          echo "Linked governance ruleset at $(git -C .governance rev-parse --short HEAD):"
          ls .governance/asyncapi-ruleset.yaml

      - name: Lint against the API guidelines (fail on errors)
        if: steps.find.outputs.has_files == 'true'
        shell: bash
        run: |
          command -v openlint >/dev/null || npm install -g openlint@1.1.3
          # No `|| true`: openlint exits non-zero on error-severity findings,
          # so the gate fails. Warnings (SHOULD rules) are shown but pass.
          FAIL=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::openlint $f"
            openlint lint -r .governance/asyncapi-ruleset.yaml "$f" || FAIL=1
            echo "::endgroup::"
          done <<'EOF'
          ${{ steps.find.outputs.files }}
          EOF
          exit $FAIL

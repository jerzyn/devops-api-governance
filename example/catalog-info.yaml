# Backstage catalog entities for this repository: the Orders API (REST) and
# the Order Events API (MQTT), side by side. Discovered by the Gitea entity
# provider (scans the Gitea org for catalog-info.yaml at repo root).
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: orders-api
  title: Orders API
  description: 'Read access to customer orders (REST, OpenAPI 3.1): look up an order and its payment status.'
  tags:
    - openapi
    - orders
  links:
    - url: http://localhost:8081
      title: Backend (local demo provider)
    # Microcks links (the auto-sync provider is incompatible with this Backstage
    # line, so the mock + tests are surfaced as plain links instead).
    - url: http://localhost:8080/#/services
      title: Microcks — mocks & contract tests
      icon: dashboard
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  definition:
    $text: ./contracts/orders-openapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backend
  title: Orders Backend (REST)
  description: Minimal provider-under-test implementing the Orders API.
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  providesApis:
    - orders-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: order-events-api
  title: Order Events API
  description: 'The lifecycle of a customer order as events on MQTT (AsyncAPI 3.1): order created, order paid.'
  tags:
    - asyncapi
    - mqtt
    - orders
  links:
    - url: http://localhost:8080/#/services
      title: 'Microcks: mock events and contract tests'
      icon: dashboard
spec:
  type: asyncapi
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  definition:
    $text: ./contracts/order-events-asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-backend
  title: Orders Backend (MQTT)
  description: Publishes the Order Events API's events (the provider under test).
  tags:
    - mqtt
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  providesApis:
    - order-events-api
  dependsOn:
    - resource:default/mqtt-broker
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-subscriber
  title: Orders Subscriber (MQTT)
  description: Consumes the Order Events API and logs every event.
  tags:
    - mqtt
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  consumesApis:
    - order-events-api
  dependsOn:
    - resource:default/mqtt-broker
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: mqtt-broker
  title: MQTT Broker
  description: Eclipse Mosquitto, the broker the order events travel through (mqtt://mosquitto:1883).
  tags:
    - mqtt
    - mosquitto
spec:
  type: message-broker
  owner: group:default/platform-team
  system: orders
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: orders
  title: Orders
  description: Order processing. The Orders API serves an order, the order lifecycle events connect the services.
spec:
  owner: group:default/platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  title: Platform Team
  description: Owns API governance tooling and the demo platform.
spec:
  type: team
  children: []

asyncapi: 3.1.0
info:
  title: Order Events API
  version: 1.0.0
  description: |
    The lifecycle of a customer order as events: the Orders backend publishes
    one event each time an order changes state, so other services (shipping,
    invoicing, notifications) react without polling the Orders API.

    Each event type has its own MQTT topic, with the order id in the topic:
    `orders/v1/{orderId}/created` when an order is accepted and
    `orders/v1/{orderId}/paid` when its payment is confirmed. Subscribe to
    `orders/v1/+/created` for all new orders, or to `orders/v1/{orderId}/#`
    to follow one order.

    Events are sent with QoS 1 (at least once) and not retained: a consumer
    may see an event twice and should deduplicate by `orderId`. Payloads are
    JSON and open: new optional fields can appear, so ignore what you do not
    know. A breaking change gets a new topic version (`orders/v2/...`).
  contact:
    name: Platform team
    url: http://localhost:7007/catalog/default/group/platform-team
    email: platform-team@example.com
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
  tags:
    - name: orders
defaultContentType: application/json

servers:
  local:
    host: mosquitto:1883
    protocol: mqtt
    description: Local Mosquitto broker of the demo (plain MQTT, no TLS).

channels:
  # One topic per event type: MQTT has no message type header, so subscribers
  # pick the events they want by topic, and a contract test listens to one.
  orderCreated:
    address: orders/v1/{orderId}/created
    description: An order was accepted.
    parameters:
      orderId:
        description: Identifier of the order.
    messages:
      orderCreated:
        $ref: '#/components/messages/OrderCreated'
  orderPaid:
    address: orders/v1/{orderId}/paid
    description: The payment for an order was confirmed.
    parameters:
      orderId:
        description: Identifier of the order.
    messages:
      orderPaid:
        $ref: '#/components/messages/OrderPaid'

# One message per operation: Microcks mocks one example per operation, and
# only operations with an mqtt binding (Stage 0 findings).
operations:
  sendOrderCreated:
    action: send
    channel:
      $ref: '#/channels/orderCreated'
    summary: Publish an order created event
    description: Sent once, when the backend accepts a new order.
    messages:
      - $ref: '#/channels/orderCreated/messages/orderCreated'
    bindings:
      mqtt:
        qos: 1
        retain: false
  sendOrderPaid:
    action: send
    channel:
      $ref: '#/channels/orderPaid'
    summary: Publish an order paid event
    description: Sent once, when the payment for an order is confirmed.
    messages:
      - $ref: '#/channels/orderPaid/messages/orderPaid'
    bindings:
      mqtt:
        qos: 1
        retain: false

components:
  messages:
    OrderCreated:
      name: OrderCreated
      title: Order created
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OrderCreatedPayload'
      examples:
        - name: newOrder
          payload:
            orderId: '123'
            createdAt: '2026-11-11T10:00:00Z'
    OrderPaid:
      name: OrderPaid
      title: Order paid
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OrderPaidPayload'
      examples:
        - name: paidOrder
          payload:
            orderId: '123'
            isPaid: true

  # Payload schemas stay open (no additionalProperties: false), so adding an
  # optional field is not a breaking change for consumers (Stage 0 findings).
  schemas:
    OrderCreatedPayload:
      type: object
      required: [orderId, createdAt]
      properties:
        orderId:
          type: string
        createdAt:
          type: string
          format: date-time
    OrderPaidPayload:
      type: object
      required: [orderId, isPaid]
      properties:
        orderId:
          type: string
        isPaid:
          type: boolean

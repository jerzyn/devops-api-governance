openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: |
    Access to customer orders. Look up an order by its identifier and check
    whether it has been paid.

    Errors are returned as `application/problem+json` (RFC 9457).
  contact:
    name: Orders team
    email: orders-team@api-peak.com
    url: https://developer.api-peak.com/orders
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.api-peak.com
tags:
  - name: Orders
    description: Customer orders and their payment status.
paths:
  /orders/{orderId}:
    summary: Orders resource
    get:
      summary: Get order
      operationId: getOrder
      description: Retrieve a single order by its unique identifier.
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique identifier of the order.
          schema:
            type: string
          examples:
            order_123:
              value: "123"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  isPaid:
                    type: boolean
              examples:
                order_123:
                  value:
                    orderId: "123"
                    isPaid: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    format: uri
                  title:
                    type: string
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
              examples:
                missing_id:
                  value:
                    type: https://errors.api-peak.com/bad-request
                    title: Bad Request
                    detail: orderId path parameter is required.
                    instance: https://api.api-peak.com/orders/
                    status: 400

openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: |
    Read access to the customer orders of API Peak. Shops, customer service
    and the billing team use it to look up a single order by its identifier
    and to see whether it has been paid.

    The API is read-only: orders are created and paid elsewhere, and every
    change of an order is also published as an event in the Order Events API
    (`orders/v1/{orderId}/created`, `orders/v1/{orderId}/paid`), so a client
    that needs to react to changes subscribes there instead of polling here.

    Identifiers are opaque strings. Responses are JSON; fields may be added
    over time, so clients must ignore fields they do not know. Errors are
    returned as `application/problem+json` (RFC 9457), with a stable `type`
    URL per error.
  contact:
    name: Orders team
    email: orders-team@api-peak.com
    url: https://developer.api-peak.com/orders
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.api-peak.com
tags:
  - name: Orders
    description: Customer orders and their payment status.
paths:
  /orders/{orderId}:
    summary: Orders resource
    get:
      summary: Get order
      operationId: getOrder
      description: Retrieve a single order by its unique identifier.
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          description: Unique identifier of the order.
          schema:
            type: string
          examples:
            order_123:
              value: "123"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  isPaid:
                    type: boolean
              examples:
                order_123:
                  value:
                    orderId: "123"
                    isPaid: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    format: uri
                  title:
                    type: string
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
              examples:
                missing_id:
                  value:
                    type: https://errors.apipeak.com/bad-request
                    title: Bad Request
                    detail: orderId path parameter is required.
                    instance: https://api.api-peak.com/orders/
                    status: 400

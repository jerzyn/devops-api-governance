openapi: 3.1.0
info:
  title: Sample Orders API
  version: 1.0.0
  description: |
    Microcks-ready contract for the Sample Orders API. Mirrors
    examples/openapi-valid.yaml but adds request/response examples so Microcks
    can derive mocks and contract test cases. Keep this in sync with the
    canonical example and with the sample-backend implementation.
  license:
    name: MIT
    url: https://example.com/license
servers:
  - url: https://api.example.com
tags:
  - name: Orders
paths:
  /orders/{orderId}:
    summary: Orders resource
    get:
      summary: Get order
      operationId: getOrder
      description: Retrieve a single order by its unique identifier.
      tags:
        - Orders
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          examples:
            order_123:
              value: "123"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  isPaid:
                    type: boolean
              examples:
                order_123:
                  value:
                    orderId: "123"
                    isPaid: true
        '400':
          description: Bad request
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    format: uri
                  title:
                    type: string
                  detail:
                    type: string
              examples:
                missing_id:
                  value:
                    type: https://errors.example.com/bad-request
                    title: Bad Request
                    detail: orderId path parameter is required.

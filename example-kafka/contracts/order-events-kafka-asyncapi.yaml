asyncapi: 3.1.0
info:
  title: Order Events Kafka API
  version: 1.0.0
  description: |
    The lifecycle of a customer order as events on Kafka: the Orders backend
    publishes one event each time an order changes state, for services that
    consume orders in bulk or replay them (analytics, invoicing, search).

    Each event type has its own topic: `orders.order-created.v1` when an
    order is accepted and `orders.order-paid.v1` when its payment is
    confirmed. Every message is keyed by the order id, so all events of one
    order land on one partition and arrive in order.

    Topics keep events for 7 days, so a consumer can replay after an outage.
    Payload schemas are registered in the schema registry and change only in
    forward-compatible ways; new optional fields can appear, so ignore what
    you do not know. A breaking change gets a new topic (`...v2`).
  contact:
    name: Platform team
    url: http://localhost:7007/catalog/default/group/platform-team
    email: platform-team@api-peak.com
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
  tags:
    - name: orders
defaultContentType: application/json

servers:
  local:
    host: kafka:9092
    protocol: kafka
    description: Local Kafka broker of the demo (SASL/PLAIN, no TLS).

# One topic per event type: the registry keys each payload schema by topic,
# and a contract test listens to one topic.
channels:
  orderCreated:
    address: orders.order-created.v1
    description: An order was accepted.
    messages:
      orderCreated:
        $ref: '#/components/messages/OrderCreated'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          retention.ms: 604800000
          cleanup.policy: [delete]
        bindingVersion: 0.5.0
  orderPaid:
    address: orders.order-paid.v1
    description: The payment for an order was confirmed.
    messages:
      orderPaid:
        $ref: '#/components/messages/OrderPaid'
    bindings:
      kafka:
        partitions: 3
        replicas: 1
        topicConfiguration:
          retention.ms: 604800000
          cleanup.policy: [delete]
        bindingVersion: 0.5.0

operations:
  sendOrderCreated:
    action: send
    channel:
      $ref: '#/channels/orderCreated'
    summary: Publish an order created event
    description: Sent once, when the backend accepts a new order.
    messages:
      - $ref: '#/channels/orderCreated/messages/orderCreated'
    bindings:
      kafka:
        bindingVersion: 0.5.0
  sendOrderPaid:
    action: send
    channel:
      $ref: '#/channels/orderPaid'
    summary: Publish an order paid event
    description: Sent once, when the payment for an order is confirmed.
    messages:
      - $ref: '#/channels/orderPaid/messages/orderPaid'
    bindings:
      kafka:
        bindingVersion: 0.5.0

components:
  messages:
    OrderCreated:
      name: OrderCreated
      title: Order created
      description: An order was accepted. Sent once per order, when the backend accepts it.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OrderCreatedPayload'
      bindings:
        kafka:
          key:
            type: string
            description: The order id; all events of one order land on one partition, in order.
          bindingVersion: 0.5.0
      examples:
        - name: newOrder
          payload:
            orderId: '123'
            createdAt: '2026-11-11T10:00:00Z'
    OrderPaid:
      name: OrderPaid
      title: Order paid
      description: The payment for an order was confirmed. Sent once per order.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OrderPaidPayload'
      bindings:
        kafka:
          key:
            type: string
            description: The order id; all events of one order land on one partition, in order.
          bindingVersion: 0.5.0
      examples:
        - name: paidOrder
          payload:
            orderId: '123'
            isPaid: true

  # Open schemas, as for MQTT: adding a field does not break consumers.
  schemas:
    OrderCreatedPayload:
      type: object
      required: [orderId, createdAt]
      properties:
        orderId:
          type: string
        createdAt:
          type: string
          format: date-time
    OrderPaidPayload:
      type: object
      required: [orderId, isPaid]
      properties:
        orderId:
          type: string
        isPaid:
          type: boolean

# Backstage catalog entities for the Kafka consumer repository. Discovered by
# the Gitea entity provider (catalog-info.yaml at the repo root).
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: order-events-kafka-api
  title: Order Events Kafka API
  description: The lifecycle of a customer order as events on Kafka (AsyncAPI 3.1), keyed by order id; payload schemas in the schema registry.
  tags:
    - asyncapi
    - kafka
    - orders
  links:
    - url: http://localhost:8080/#/services
      title: 'Microcks: mock events and contract tests'
      icon: dashboard
    - url: http://localhost:8280/apis/registry/v3/groups/order-events-kafka-api/artifacts
      title: 'Apicurio Registry: payload schemas'
      icon: dashboard
spec:
  type: asyncapi
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  definition:
    $text: ./contracts/order-events-kafka-asyncapi.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-kafka-backend
  title: Orders Backend (Kafka)
  description: Publishes the Order Events Kafka API's events, checked against the schema registry.
  tags:
    - kafka
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  providesApis:
    - order-events-kafka-api
  dependsOn:
    - resource:default/kafka-cluster
    - resource:default/schema-registry
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-kafka-subscriber
  title: Orders Subscriber (Kafka)
  description: Consumes the Order Events Kafka API and logs every event.
  tags:
    - kafka
spec:
  type: service
  lifecycle: experimental
  owner: group:default/platform-team
  system: orders
  consumesApis:
    - order-events-kafka-api
  dependsOn:
    - resource:default/kafka-cluster
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: kafka-cluster
  title: Kafka Cluster
  description: Single-node Apache Kafka (KRaft), apps on kafka:9092 (SASL/PLAIN), platform tools on kafka:9094.
  tags:
    - kafka
spec:
  type: message-broker
  owner: group:default/platform-team
  system: orders
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: schema-registry
  title: Schema Registry
  description: Apicurio Registry, the published payload schema of every topic with its compatibility rule.
  tags:
    - apicurio
spec:
  type: schema-registry
  owner: group:default/platform-team
  system: orders

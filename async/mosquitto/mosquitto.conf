# Mosquitto broker of the demo. Since Stage 5 every client authenticates, and
# what it may publish or subscribe to is the broker policy generated from the
# AsyncAPI contract and the catalog. The dynamic security plugin holds the
# accounts and the policy; broker-policy-deployer applies a new policy live
# through its $CONTROL API. Unlike a plain acl_file, the plugin refuses a
# subscription outside the policy (SUBACK "not authorized"), so a consumer
# sees "denied" instead of silence.
listener 1883
allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type subscribe

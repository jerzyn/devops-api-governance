services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    environment:
      # Use SQLite for a simple demo setup
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      # Server settings
      - GITEA__server__ROOT_URL=http://localhost:3000/
      - GITEA__server__HTTP_PORT=3000
      # Ensure Actions are enabled (1.21+ enables by default, this is explicit)
      - GITEA__actions__ENABLED=true
      # Skip the first-run web installer so the seed service can use the API/CLI
      # immediately on a fresh volume.
      - GITEA__security__INSTALL_LOCK=true
      # File sessions (ensure gitea-data ownership is git/1000; see README)
      - GITEA__session__PROVIDER=file
      - GITEA__session__PROVIDER_CONFIG=/data/gitea/sessions
      # OpenID can break sign-in if provider metadata is corrupted after DB recovery
      - GITEA__openid__ENABLE_OPENID_SIGNIN=false
      - GITEA__openid__ENABLE_OPENID_SIGNUP=false
      # Secrets are auto-generated by Gitea on first run and persisted in the
      # gitea-data volume, so `docker compose up` works with no .env. To pin them
      # explicitly (production-like), set these in .env and uncomment:
      # - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY}
      # - GITEA__security__INTERNAL_TOKEN=${GITEA_INTERNAL_TOKEN}
      # - GITEA__server__LFS_JWT_SECRET=${GITEA_LFS_JWT_SECRET}
      # - GITEA__oauth2__JWT_SECRET=${GITEA_OAUTH2_JWT_SECRET}
    volumes:
      - ./gitea-data:/data
    ports:
      - "3000:3000" # HTTP
      - "2222:22"   # SSH (optional for demo)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

  # One-shot seed: creates the Gitea admin, org, repo, pushes this repo, and
  # writes a runner registration token to the shared seed-state volume. Needs
  # the Docker socket to run `gitea` CLI commands inside the gitea container.
  gitea-seed:
    image: docker:27-cli
    container_name: gitea-seed
    restart: "no"
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      - GITEA_ADMIN_USER=${GITEA_ADMIN_USER:-demo}
      - GITEA_ADMIN_PASSWORD=${GITEA_ADMIN_PASSWORD:-demo12345}
    volumes:
      # Consumer (product) repo: the example/ subrepo (contract + catalog +
      # backend). Test PRs run here and never touch the project repo.
      - ./example:/repo
      # Governance context (Spectral ruleset + functions + seed scripts).
      # Pushed to a separate Gitea repo that the consumer's CI clones (linked).
      - ./governance:/governance
      # Seed scripts are orchestration, kept at the repo root (not governance).
      - ./scripts:/scripts:ro
      - seed-state:/seed
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "apk add --no-cache git curl >/dev/null && sh /scripts/seed-gitea.sh"

  gitea-runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    restart: unless-stopped
    depends_on:
      gitea-seed:
        condition: service_completed_successfully
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000/
      # run.sh reads the token from this file (written by gitea-seed).
      - GITEA_RUNNER_REGISTRATION_TOKEN_FILE=/seed/runner-token
      - GITEA_RUNNER_NAME=local-runner
      # Example label for Docker-based jobs (can be changed per your workflows)
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://node:20-bullseye
      # Pin Docker API version to avoid 500 from daemon when client uses v1.53
      - DOCKER_API_VERSION=1.44
      # Use config so job containers join gitea-network and can clone repo from Gitea
      - CONFIG_FILE=/config.yaml
    volumes:
      # Runner config and cache
      - ./runner-data:/data
      # Config: job containers use gitea-network so checkout can reach Gitea
      - ./runner-config.yaml:/config.yaml:ro
      # Give runner access to host Docker (simpler for local demo)
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared seed state (runner registration token)
      - seed-state:/seed:ro

  # --- Track B: contract testing stack (profile: contract) ---------------------
  # Minimal provider-under-test implementing the Sample Orders API contract.
  sample-backend:
    # Built from the example subrepo so backend edits during a test scenario
    # take effect here without touching the project repo.
    build: ./example/sample-backend
    container_name: sample-backend
    restart: unless-stopped
    profiles: ["contract"]
    environment:
      - PORT=8081
      # Set DRIFT=true to serve contract-violating responses (test should FAIL).
      - DRIFT=${SAMPLE_BACKEND_DRIFT:-false}
    ports:
      - "8081:8081"

  # Microcks "uber" distribution: all-in-one. No Keycloak, no Postgres, no Kafka,
  # and no external MongoDB — it runs an embedded in-memory Mongo (verified: the
  # uber image ignores SPRING_DATA_MONGODB_* and persists in memory). Imported
  # contracts are therefore ephemeral and re-imported on each test run.
  microcks-uber:
    image: quay.io/microcks/microcks-uber:latest
    container_name: microcks-uber
    restart: unless-stopped
    profiles: ["contract"]
    environment:
      - SPRING_PROFILES_ACTIVE=uber
      - KEYCLOAK_ENABLED=false
      # URL Microcks uses to reach itself when invoking HTTP contract tests.
      - TEST_CALLBACK_URL=http://microcks-uber:8080
    ports:
      - "8080:8080"

  # One-shot seed: imports the OpenAPI contract into Microcks once it is up.
  microcks-seed:
    image: curlimages/curl:8.11.1
    container_name: microcks-seed
    restart: "no"
    profiles: ["contract"]
    depends_on:
      microcks-uber:
        condition: service_started
    volumes:
      # Contract comes from the consumer repo (example); the seed script
      # itself lives in the governance context.
      - ./example:/repo:ro
      - ./governance:/governance:ro
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/seed-microcks.sh"]

  # --- Track A: catalog (profile: catalog) -------------------------------------
  # Backstage API catalog. Self-contained multi-stage build (Node 24 in-image),
  # so no host Node is required. Serves frontend + backend on a single port 7007.
  backstage:
    build:
      context: ./governance/api-catalog
      dockerfile: packages/backend/Dockerfile
    container_name: backstage
    restart: unless-stopped
    profiles: ["catalog"]
    depends_on:
      gitea-seed:
        condition: service_completed_successfully
    environment:
      # Backstage's Gitea integration authenticates with the seeded admin's
      # username + password (no runtime token needed).
      - GITEA_USER=${GITEA_ADMIN_USER:-demo}
      - GITEA_PASSWORD=${GITEA_ADMIN_PASSWORD:-demo12345}
    volumes:
      # Mount config so changes don't require an image rebuild.
      - ./governance/api-catalog/app-config.yaml:/app/app-config.yaml:ro
    ports:
      - "7007:7007"

volumes:
  seed-state:

networks:
  default:
    name: gitea-network
